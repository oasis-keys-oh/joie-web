[build]
  command = "npm run check:images && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# ── Clean URL rewrites for static HTML files in /public ──────────────────────
# These serve intake/success/cancel/cave/privacy/support without the .html extension

[[redirects]]
  from   = "/intake"
  to     = "/intake.html"
  status = 200

[[redirects]]
  from   = "/success"
  to     = "/success.html"
  status = 200

[[redirects]]
  from   = "/cancel"
  to     = "/cancel.html"
  status = 200

[[redirects]]
  from   = "/cave"
  to     = "/cave.html"
  status = 200

[[redirects]]
  from   = "/privacy"
  to     = "/privacy.html"
  status = 200

[[redirects]]
  from   = "/support"
  to     = "/support.html"
  status = 200

# ── Trip follower landing (public) ───────────────────────────────────────────
# /follow/:slug?ref=… serves the static follower page in /public. The slug is
# read from the path by follow.html's client JS. Kept distinct from the (portal)
# /trip/* routes so the follow page is fully public and the auth gate is intact.

[[redirects]]
  from   = "/follow/*"
  to     = "/follow.html"
  status = 200

# ── Browser favicon fallback ─────────────────────────────────────────────────
# Browsers request /favicon.ico automatically even when <link rel="icon"> is
# set. Serve icon.svg in its place so DevTools doesn't log a 404.

[[redirects]]
  from   = "/favicon.ico"
  to     = "/icon.svg"
  status = 200
